# Server configuration
server.port=8080

# Shelly Bulb configuration
# IP is now optional and used as fallback if mDNS discovery fails
shelly.bulb.ip=192.168.8.135
shelly.bulb.endpoint=/light/0

# mDNS Discovery configuration
# Set to false to disable automatic discovery on startup
shelly.discovery.auto-start=true

# Logging configuration
logging.level.root=INFO
logging.level.ai.robocoders.control.shelly=DEBUG
# Enable debug logging for JmDNS
logging.level.javax.jmdns=INFO
